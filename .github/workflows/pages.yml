name: Deploy Canadian GRADS to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - canadian-grads-github-pages.zip
      - .github/workflows/pages.yml
      - .github/scripts/configure-domain.py
      - .github/scripts/optimize-site.py
      - .github/scripts/restore-appendices.py
      - .github/scripts/style-appendices.py
      - .github/scripts/improve-site.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Extract public website
        run: |
          mkdir -p public
          unzip -q canadian-grads-github-pages.zip -d public
          test -f public/index.html
          test -f public/.nojekyll
      - name: Configure custom domain URLs
        run: python3 .github/scripts/configure-domain.py public
      - name: Set up Python for asset optimization
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install website asset tools
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0 reportlab==4.4.9 pdfplumber==0.11.9 pypdf==6.10.0
      - name: Typeset professional appendix PDFs
        run: |
          python .github/scripts/style-appendices.py public/assets styled-appendices
          cp styled-appendices/*.pdf public/assets/
          test "$(find styled-appendices -maxdepth 1 -name '*.pdf' | wc -l)" -eq 12
      - name: Restore appendix PDF links
        run: python .github/scripts/restore-appendices.py public
      - name: Optimize public assets
        run: python .github/scripts/optimize-site.py public
      - name: Improve navigation and appendix discovery
        run: python .github/scripts/improve-site.py public
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

