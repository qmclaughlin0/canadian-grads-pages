name: Deploy Canadian GRADS to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - canadian-grads-github-pages.zip
      - .github/workflows/pages.yml
      - .github/scripts/configure-domain.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Extract public website
        run: |
          mkdir -p public
          unzip -q canadian-grads-github-pages.zip -d public
          test -f public/index.html
          test -f public/.nojekyll
      - name: Configure custom domain URLs
        run: python3 .github/scripts/configure-domain.py public
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

